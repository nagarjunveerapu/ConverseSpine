# Unit tests + typecheck on every PR and main push.
# Deploy dev (deploy-dev.yml) runs after this workflow succeeds on main.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Second-tenant resolution against the REAL bge-base embedder (no fake
  # vectors) — tests/embed-gate-second-tenant.test.ts. Uses the dev
  # environment's Workers AI credentials; EMBED_GATE_REQUIRED turns a missing
  # credential into a failure here instead of a silent skip.
  embed-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run test:embed-gate
        env:
          EMBED_GATE_REQUIRED: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
