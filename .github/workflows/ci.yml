# Unit tests + typecheck on every PR and main push.
# Deploy dev (deploy-dev.yml) runs after this workflow succeeds on main.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Second-tenant resolution against the REAL bge-base embedder (no fake
  # vectors) — tests/embed-gate-second-tenant.test.ts. Uses the dev
  # environment's Workers AI credentials; EMBED_GATE_REQUIRED turns a missing
  # credential into a failure here instead of a silent skip.
  embed-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Temporary diagnostic (2026-08-17): prints HTTP status codes + CF error
      # codes only — never the token. Answers whether the secret is a valid
      # deploy token missing the Workers AI permission, or broken outright.
      - name: Probe token scopes (status codes only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          probe() {
            name="$1"; url="$2"; shift 2
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' "$url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@")
            printf '%-22s -> %s ' "$name" "$code"
            jq -c '[.errors[]? | {code, message}]' /tmp/r.json 2>/dev/null || echo
          }
          probe "user-token-verify"  "https://api.cloudflare.com/client/v4/user/tokens/verify"
          probe "acct-token-verify"  "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          probe "workers-scripts"    "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          probe "workers-ai-run"     "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/baai/bge-base-en-v1.5" -X POST -H 'content-type: application/json' --data '{"text":["ping"]}'

      - run: npm run test:embed-gate
        env:
          EMBED_GATE_REQUIRED: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
