# Manual prod deploy only — never auto-deploy prod from main.
# Cutover: NayaDesk docs/PROD_CUTOVER.md (NAYADESK → nayadesk-prod).
name: Deploy prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke /health
        run: |
          set -euo pipefail
          url="https://converse-spine.nagarjun-arjun.workers.dev/health"
          body="$(curl -fsS "$url")"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          # Prefer service binding; HTTP fallback URL is also acceptable.
          echo "$body" | grep -Eq '"nayadesk":"(binding|https://nayadesk-prod)'
