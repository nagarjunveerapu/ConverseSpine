# Nightly graded verify of every embedding lane on the DEPLOYED dev and prod
# workers — the golden battery from scripts/embed-pipeline/golden.json, graded
# on answers (answer-contains-fact), not on-topic-ness. Red = a lane regressed
# or an index drifted from its source of truth.
#
# Runs at 05:00 UTC: after Desk's 18:00 UTC reconcile cron and Spine prod's
# 03:30 UTC education/intent rebuild, so it verifies the converged state.
#
# Secrets come from the GitHub ENVIRONMENT (`dev` / `production`), the same
# place deploy-dev.yml and deploy-prod.yml read them — repo-level secrets are
# not used in this repo, and a job that forgets `environment:` silently gets
# empty strings. CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID already live
# there; add SIL_EVAL_SECRET (preferred — it opens only the two read-only
# probe routes) or BOT_SHARED_SECRET to each environment, matching that env's
# deployed worker secret.
name: Embed verify

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # `env` is the wrangler.toml environment the pipeline measures;
          # `gh_environment` is what GitHub calls the same thing (prod's is
          # spelled "production" — they are not interchangeable).
          - env: dev
            gh_environment: dev
          - env: prod
            gh_environment: production
    environment: ${{ matrix.gh_environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify ${{ matrix.env }}
        env:
          # SIL_EVAL_SECRET opens the two read-only probe routes and nothing
          # else — the right authority for a measurement job. BOT_SHARED_SECRET
          # stays as the fallback (dev already has it), but prod should carry
          # the narrow key: the bot secret also HMACs Desk's signed media URLs,
          # so handing it to CI, or rotating it to do so, is buyer-visible.
          SIL_EVAL_SECRET: ${{ secrets.SIL_EVAL_SECRET }}
          BOT_SHARED_SECRET: ${{ secrets.BOT_SHARED_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/embed-pipeline.mjs verify --env ${{ matrix.env }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embed-verify-${{ matrix.env }}
          path: |
            docs/reports/embed-verify-${{ matrix.env }}.html
            docs/reports/embed-verify-${{ matrix.env }}.json
