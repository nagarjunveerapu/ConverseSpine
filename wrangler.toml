# ConverseSpine — production bot Worker
# CRM: NayaDesk (service binding). Spine: deterministic turn contract.

name = "converse-spine"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
LOG_LEVEL = "info"
# Names the INTENT_VECTORS index below, so the rebuild manifest is keyed per
# index and not just per vector space. Four envs share one TURN_CACHE; without
# this, two of them on the same projection diff against each other's writes.
# tests/intent-projection-space.test.ts holds this equal to index_name.
SIL_INTENT_INDEX = "naya-intent-phrasings"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
DEFAULT_BUILDER_ID = "lokations"
ADVISOR_BUILDER_ID = "naya-advisor"
LANGFUSE_BASE_URL = "https://cloud.langfuse.com"

[[vectorize]]
binding = "INTENT_VECTORS"
index_name = "naya-intent-phrasings"

[[vectorize]]
binding = "PROJECT_VECTORS"
index_name = "naya-project-names"

[[vectorize]]
binding = "EDUCATION_VECTORS"
index_name = "naya-buyer-education"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "TURN_CACHE"
id = "66ef723ea8614317b80aac74b77f03d1"
preview_id = "66ef723ea8614317b80aac74b77f03d1"

[[durable_objects.bindings]]
name = "TURN_DEBOUNCER"
class_name = "TurnDebouncer"

[[migrations]]
tag = "v1"
new_classes = ["TurnDebouncer"]

# ── Local dev (wrangler dev) ───────────────────────────────────────────
[env.dev]
name = "converse-spine-dev"
remote = true

# Deployed dev: NAYADESK service binding (avoids CF error 1042 on worker→worker HTTP).
# Local wrangler dev: remote = true → hits nayadesk-dev on Cloudflare (not local sim).
[[env.dev.services]]
binding = "NAYADESK"
service = "nayadesk-dev"
remote = true

[[env.dev.kv_namespaces]]
binding = "TURN_CACHE"
id = "66ef723ea8614317b80aac74b77f03d1"
preview_id = "66ef723ea8614317b80aac74b77f03d1"
remote = true

[env.dev.vars]
NAYADESK_URL = "https://nayadesk-dev.nagarjun-arjun.workers.dev"
ADVISOR_BUILDER_ID = "naya-advisor"
LOG_LEVEL = "info"
LOCAL_TURN_LOG = "on"
# Failure-as-a-value Phase 0: additive shadow ledger/log records only.
FAILURE_LOG = "true"
# Failure-as-a-value Phase 1: EMI authority + destructive-intent disambiguation.
FAILURE_TOOLS = "true"
# Failure-as-a-value Phase 2: embedding-routed policy and definition outcomes.
FAILURE_ROUTING = "true"
# Failure-as-a-value Phase 3: geography authority + non-persistent relaxation.
FAILURE_SEARCH = "true"
# Failure-as-a-value Phase 4: required facts + partial no-data outcomes.
FAILURE_ANSWER = "true"
# WhatsApp project-first: skip discovery brief; pack list XOR 3 buttons.
WA_PROJECT_FIRST = "on"
# THE WIRE: a >=tau_high answer-intent bind vetoes the isFocusedSearchPivot
# regex. OFF -- measured too broad. On merged main, focused on Brigade
# Eldorado, 4 of 6 genuine pivots were PINNED to the old project:
#   "2 BHK in Jayanagar"             -> Eldorado 2 BHK configs
#   "actually my budget is only 50L" -> Eldorado pricing (Rs 89L+)
# An offline audit of 1,751 real captured texts predicted this: of the 64
# turns the veto fires on, ~31 carry a NEW search constraint and are genuine
# pivots. Narrowing needs the extract, which has not run at that point --
# which is the argument for the ordering phase in the dialogue-state LLD.
# Re-enable only with that phase, gated on the 31/33 split.
ROUTING_IN_GOAL = "false"
# Phase 0d — extract∥routing before focus release (dig soak only; do not merge
# as default until founder gate). Same dig URL; flag off → prior order.
UNDERSTANDING_BEFORE_MUTATION = "true"
# Multi-intent Phase A — union askTopics (cap 3) instead of empty-only merge.
# Dig-on with Phase C park (top-2 + explicit continuation). Off elsewhere until soak.
TOPIC_UNION = "true"
# ADR-005: rank advisor chips by the transition table (out of shadow), dev-first.
CHIP_RANK_LIVE = "true"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
DEFAULT_BUILDER_ID = "lokations"
LANGFUSE_BASE_URL = "https://cloud.langfuse.com"
# SIL data pipeline — weekly intent-index rebuild from the git registry.
# Model is a config: the U12 bake-off decided it (PR #222) and the founder
# called it 18 Aug 2026 — bge-m3, adopted on the name evidence (1/120 vs
# 11/120 false-binds on real negatives at matched 90% recall). The raw intent
# floor it gives up (0.579 vs 0.624) is won back by the p32 projection below:
# holdout top-1 92.0%, real-turn correct&bound 88% vs the old system's 64%.
# ONE model for every lane — intent, education, auto-teach, and the
# PROJECT_VECTORS name queries — so all three indexes flip together below.
SIL_EMBED_MODEL = "@cf/baai/bge-m3"
SIL_REGISTRY_URL = "https://raw.githubusercontent.com/nagarjunveerapu/ConverseSpine/main/corpus/intent-registry.jsonl"
# Master switch for the canonical intent-embed schema (entity-masked corpus +
# query in lockstep, ships the v2 + mined corpus).
#
# It is TWO changes on one switch, which is why it gets its own index. It swaps
# what is embedded (raw phrasing → entity-masked) AND which rows are eligible:
# the legacy gate is audit_status='clean' alone, the canonical gate also admits
# machine_v2, mined_yantra_v1 and desk_promoted. Measured on the live registry
# 16 Aug 2026: 8,727 eligible → 19,266. A 2.2x corpus, not just a re-embed —
# and the lane that finally carries Desk-taught phrasings, which are fetched
# only in canonical mode.
#
# Safe to flip here ONLY because SIL_INTENT_INDEX points at a fresh index: the
# manifest starts empty, so all 19,266 rows embed, and no raw vector survives
# alongside them. CS #210 put the mode in the content hash so the flip also
# invalidates row-wise; both guards now say the same thing.
# MEASURED 16 Aug 2026, and NOT flipped as a result. The canonical index was
# built (naya-intent-p256-f6665e0b79-canon-dev, 19,404 vectors) and probed
# against this one over the same six conversations. Entity masking turns "tell
# me about Brigade Eldorado" into "tell me about <project>", which binds
# find_projects instead of get_project_info — the most common opener, taught
# four times as get_project_info. 8 of 20 turns changed intent, only 2 changed
# the REPLY, and neither improved. Flip this to "true" together with
# SIL_INTENT_INDEX below, once the corpus can separate a named-project ask from
# a discovery ask without the name. The canon index is kept, already full.
SIL_CANONICAL_EMBED = "false"
# The index this env writes to and queries. Keys the rebuild manifest — see
# intentManifestKey. Must equal [[env.dev.vectorize]] index_name.
SIL_INTENT_INDEX = "naya-intent-p32-1c003deba7-full-dev"
# Phase 2 — discourse state tokens on state-dependent embed queries + rebuild expand.
# Query gated to ask_next_step/confirm/deixis so fact intents stay raw↔raw.
SIL_STATE_TOKENS = "true"
# Understanding Flywheel Wave A — every turn feeds Desk's review queue so the
# /operations/understanding board sees real traffic. Dev-only until the board
# has soaked; prod omits the var (= off, zero behaviour change).
UNDERSTANDING_CAPTURE = "true"
SIL_EVAL_ENABLED = "true"
# Wave C overnight auto-teach — gate-checked self-promotion. Requires canonical
# mode; flip to "true" AFTER the SIL_CANONICAL_EMBED cutover has soaked.
UNDERSTANDING_AUTO_TEACH = "false"
# ── Embeddings-first, on dev ──────────────────────────────────────────────
# The learned metric (256x768 fitted on the labelled corpus) and the inverted
# ladder: state-dependent rules only, then the embedding, then regex as the
# fallback that catches what it declines. Both measured before flipping —
# see PRs #115/#116/#117. Prod stays on the raw model and the old order until
# its vector indexes are filled and this has soaked.
#
# p32-1c003deba7 is the m3-space matrix (32x1024, fitted on 19,238 corpus rows;
# scripts/sil-train-projection.py picked rank 32 — plain whitening — over the
# old 256). Must match the bundled PROJECTION_ID or the Worker falls back to
# raw vectors against a projected index. Taus in the matrix are LIVE-calibrated
# (18 Aug 2026, sil-live-ab against this dev deployment, n=600 holdout):
# 0.8984 binds at 98.3% live precision / 40% coverage, 0.8557 gap-fills at
# 95.2% / 80%. The offline taus (0.920/0.822) collapsed to 17% live coverage —
# Vectorize scores are lossy; never trust an offline tau.
SIL_INTENT_PROJECTION = "p32-1c003deba7"
SIL_EMBED_FIRST = "true"
# Visit open acts: teach-only on dig (no ask-team / force regex fallback).
# Ablation gate after visit-mv upsert — grow corpus if VIS-MV-04/06 fail.
VISIT_EMBED_ACTS_ONLY = "true"
BAML_EXTRACT_MODE = "promote"
# Hybrid: voice templates for ~80%; ≤1 paid DeepSeek/turn; BAML shadow on sync.
# (Must live under [env.dev.vars] — not under [env.dev.triggers].)
HYBRID_COMPOSE = "on"
SYNC_BAML_MODE = "shadow"
PAID_LLM_TIMEOUT_MS = "1200"
LLM_RATE_TARGET = "0.2"
INTENT_RECOVERY_MODE = "promote"

# Weekly rebuild — Mondays 03:30 UTC. Nightly 22:30 UTC (04:00 IST) = Wave C
# auto-teach (runs after Desk's 18:00 UTC sweep+teacher; no-op unless
# UNDERSTANDING_AUTO_TEACH=true).
[env.dev.triggers]
crons = ["30 3 * * 1", "30 22 * * *"]

[[env.dev.durable_objects.bindings]]
name = "TURN_DEBOUNCER"
class_name = "TurnDebouncer"

[[env.dev.vectorize]]
binding = "INTENT_VECTORS"
# Dev serves the LEARNED metric, CANONICALLY embedded, from an index built by
# rebuilding the registry rather than by projecting the old one.
#
# The predecessor (naya-intent-p256-f6665e0b79-full-dev) was the pre-projection
# dev index with every vector multiplied by the matrix — same ids, same
# metadata — because a rebuild from source would have dropped the ~3k
# Desk-taught and legacy rows whose text is not in the registry. That trade
# stopped working at the canonical cutover: a canonical rebuild only re-embeds
# rows the registry still has, so those ~14k unmanaged vectors (23,110 in the
# index vs 8,727 in the manifest, measured 16 Aug 2026) would have stayed in
# RAW space inside an index every query now searches canonically. Two spaces,
# one index, no error anywhere — they can still win a nearest neighbour.
#
# So the cutover builds a NEW index instead of converting this one. The old
# index is left untouched and fully valid, which makes rollback a config revert
# with no re-embed: SIL_INTENT_INDEX keys the manifest, so pointing back at the
# old name lands on the manifest that still describes it exactly.
#
# The name carries the projection id on purpose: tests/intent-projection-space
# fails the build if the configured index and SIL_INTENT_PROJECTION disagree.
#
# m3 cutover, 18 Aug 2026: a NEW index again (32-dim, the p32 projection's
# output), loaded from the same exported vectors the offline eval scored, so
# the live index IS the experiment. Predecessors left untouched — rollback to
# bge-base is a config revert of this file, zero re-embeds.
index_name = "naya-intent-p32-1c003deba7-full-dev"
remote = true

[[env.dev.vectorize]]
binding = "PROJECT_VECTORS"
# 1024-dim, Desk-built with bge-m3 (Desk's EMBEDDING_MODEL flips in lockstep —
# a 1024-dim query against the old 768-dim index is a hard error, not a bad
# ranking). naya-project-names-dev is the bge-base predecessor, kept for
# rollback.
index_name = "naya-project-names-m3-dev"
remote = true

[[env.dev.vectorize]]
binding = "EDUCATION_VECTORS"
# 1024-dim, raw m3 space (education vectors are never projected). Filled by
# rebuildEducationIndex, whose manifest is keyed per model precisely so this
# flip re-embeds everything instead of diffing clean against the old index's
# manifest and pushing nothing.
index_name = "naya-buyer-education-m3-dev"
remote = true

[env.dev.ai]
binding = "AI"
remote = true

# ── Learned-metric A/B control (ctrldev) ───────────────────────────────
# STALE ARM since the m3 cutover (18 Aug 2026): frozen on bge-base + its
# 768-dim identity index for the p256 measurement's sake. DO NOT REDEPLOY —
# the bundled matrix is now m3-space, and this env's base model would disable
# it correctly but the arm no longer measures anything current. Delete both
# A/B envs once U9's band calibration has run in the m3 space.
#
# The BASELINE arm. Raw-model vectors (no SIL_INTENT_PROJECTION) over an index
# holding EXACTLY the same 10,646 corpus rows as the projected arm.
#
# The existing dev index would have been the obvious control and the wrong one:
# it carries ~13.6k vectors from an older seeding, so a comparison against it
# would measure corpus drift as well as the metric. Same rows, same model, one
# variable.
[env.ctrldev]
name = "converse-spine-ctrldev"
remote = true

[[env.ctrldev.services]]
binding = "NAYADESK"
service = "nayadesk-dev"
remote = true

[[env.ctrldev.kv_namespaces]]
binding = "TURN_CACHE"
id = "66ef723ea8614317b80aac74b77f03d1"
preview_id = "66ef723ea8614317b80aac74b77f03d1"
remote = true

[[env.ctrldev.durable_objects.bindings]]
name = "TURN_DEBOUNCER"
class_name = "TurnDebouncer"

[[env.ctrldev.vectorize]]
binding = "INTENT_VECTORS"
index_name = "naya-intent-ident-ctrl-dev"
remote = true

[[env.ctrldev.vectorize]]
binding = "PROJECT_VECTORS"
index_name = "naya-project-names-dev"
remote = true

[env.ctrldev.ai]
binding = "AI"
remote = true

[env.ctrldev.vars]
# Keys the rebuild manifest to this env's own index — see intentManifestKey.
# Must equal this env's INTENT_VECTORS index_name.
SIL_INTENT_INDEX = "naya-intent-ident-ctrl-dev"
NAYADESK_URL = "https://nayadesk-dev.nagarjun-arjun.workers.dev"
ADVISOR_BUILDER_ID = "naya-advisor"
LOG_LEVEL = "info"
LOCAL_TURN_LOG = "on"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
DEFAULT_BUILDER_ID = "lokations"
LANGFUSE_BASE_URL = "https://cloud.langfuse.com"
SIL_EMBED_MODEL = "@cf/baai/bge-base-en-v1.5"
SIL_REGISTRY_URL = "https://raw.githubusercontent.com/nagarjunveerapu/ConverseSpine/main/corpus/intent-registry.jsonl"
SIL_CANONICAL_EMBED = "false"
UNDERSTANDING_CAPTURE = "false"
SIL_EVAL_ENABLED = "true"
UNDERSTANDING_AUTO_TEACH = "false"
# Deliberately absent: SIL_INTENT_PROJECTION. This arm is the raw model.

# ── Learned-metric A/B (projdev) ───────────────────────────────────────
# STALE ARM since the m3 cutover (18 Aug 2026): its SIL_INTENT_PROJECTION
# names the retired p256 matrix, which the bundle no longer carries. A redeploy
# would fall back to raw 768-dim vectors against a 256-dim index — a hard
# dimension error on every query. DO NOT REDEPLOY; delete with ctrldev after U9.
#
# Identical to dev in every respect EXCEPT the intent vector space: the learned
# projection is on, and INTENT_VECTORS points at the index built in that space.
# Running it as its own worker rather than flipping dev keeps the raw-model
# baseline live, so the two can be probed side by side with the same payloads
# instead of before/after a redeploy.
#
# The index name carries the projection id; tests/intent-projection-space.test.ts
# fails the build if these two ever disagree.
[env.projdev]
name = "converse-spine-projdev"
remote = true

[[env.projdev.services]]
binding = "NAYADESK"
service = "nayadesk-dev"
remote = true

[[env.projdev.kv_namespaces]]
binding = "TURN_CACHE"
id = "66ef723ea8614317b80aac74b77f03d1"
preview_id = "66ef723ea8614317b80aac74b77f03d1"
remote = true

[[env.projdev.durable_objects.bindings]]
name = "TURN_DEBOUNCER"
class_name = "TurnDebouncer"

[[env.projdev.vectorize]]
binding = "INTENT_VECTORS"
index_name = "naya-intent-p256-f6665e0b79-dev"
remote = true

[[env.projdev.vectorize]]
binding = "PROJECT_VECTORS"
index_name = "naya-project-names-dev"
remote = true

[env.projdev.ai]
binding = "AI"
remote = true

[env.projdev.vars]
# Keys the rebuild manifest to this env's own index — see intentManifestKey.
# Must equal this env's INTENT_VECTORS index_name.
SIL_INTENT_INDEX = "naya-intent-p256-f6665e0b79-dev"
NAYADESK_URL = "https://nayadesk-dev.nagarjun-arjun.workers.dev"
ADVISOR_BUILDER_ID = "naya-advisor"
LOG_LEVEL = "info"
LOCAL_TURN_LOG = "on"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
DEFAULT_BUILDER_ID = "lokations"
LANGFUSE_BASE_URL = "https://cloud.langfuse.com"
SIL_EMBED_MODEL = "@cf/baai/bge-base-en-v1.5"
SIL_REGISTRY_URL = "https://raw.githubusercontent.com/nagarjunveerapu/ConverseSpine/main/corpus/intent-registry.jsonl"
SIL_CANONICAL_EMBED = "false"
# Capture off here: this env exists to be measured, and its turns should not
# pour experimental traffic into Desk's understanding queue.
UNDERSTANDING_CAPTURE = "false"
SIL_EVAL_ENABLED = "true"
UNDERSTANDING_AUTO_TEACH = "false"
# The whole point of this env. Must match the bundled matrix's PROJECTION_ID;
# anything else (including a stale id) falls back to raw-model vectors.
SIL_INTENT_PROJECTION = "p256-f6665e0b79"
# Ladder order. "false" = historical (regex ladder pre-empts the embedding);
# "true" = state-dependent rules only, then the embedding, then regex as the
# fallback. Flipped per measurement run — see scripts/sil-ladder-ab.py.
SIL_EMBED_FIRST = "true"

# ── Production ─────────────────────────────────────────────────────────
[env.prod]
name = "converse-spine"

[[env.prod.kv_namespaces]]
binding = "TURN_CACHE"
id = "53df7275a01b4527a3421e36d7586864"

# Must match NayaDesk [env.prod] worker name (nayadesk-prod), not top-level nayadesk.
[[env.prod.services]]
binding = "NAYADESK"
service = "nayadesk-prod"

[[env.prod.durable_objects.bindings]]
name = "TURN_DEBOUNCER"
class_name = "TurnDebouncer"

[[env.prod.vectorize]]
binding = "INTENT_VECTORS"
# Prod's SIL index. naya-intent-phrasings — the name this pointed at — is the
# pre-projection generation and was never filled here (0 vectors); dev has not
# queried its equivalent since the learned metric landed. Pointing prod at a
# 256-dim index carrying the projection id keeps the two facts that must agree
# (index geometry, SIL_INTENT_PROJECTION) legible in one string, which is what
# tests/intent-projection-space asserts. The old index is left untouched, so
# rollback is a config revert with no re-embed.
#
# m3 cutover (18 Aug 2026): same discipline as dev — a NEW 32-dim index for the
# p32 matrix, pre-loaded offline from the same vectors the offline eval scored,
# then kept converged by the daily 03:30 UTC rebuild (fresh manifest — the
# index name keys it). The p256 index stays for rollback.
index_name = "naya-intent-p32-1c003deba7-full"

[[env.prod.vectorize]]
binding = "PROJECT_VECTORS"
# 1024-dim, Desk-built with bge-m3. DEPLOY ORDER MATTERS: NayaDesk prod must
# have flipped its EMBEDDING_MODEL and filled this index (lifecycle reconcile)
# BEFORE this worker deploys, or every name query is a dimension error. The
# 768-dim naya-project-names stays for rollback.
index_name = "naya-project-names-m3"

[[env.prod.vectorize]]
binding = "EDUCATION_VECTORS"
# 1024-dim raw m3 space; pre-loaded offline, converged by the daily rebuild
# under the model-keyed education manifest.
index_name = "naya-buyer-education-m3"

[env.prod.ai]
binding = "AI"

[env.prod.vars]
# Keys the rebuild manifest to this env's own index — see intentManifestKey.
# Must equal this env's INTENT_VECTORS index_name.
SIL_INTENT_INDEX = "naya-intent-p32-1c003deba7-full"
# ── Understanding on prod, step 1: fill the index ────────────────────────
# Everything here is dev's proven configuration, not a new arm. The registry is
# the same public JSONL dev rebuilds from (22,703 rows); the legacy gate admits
# audit_status='clean' minus quarantine/holdout, which measured 8,727 eligible
# on 16 Aug — so prod gets the same corpus dev serves, embedded fresh into an
# empty manifest.
#
# SIL_CANONICAL_EMBED stays "false" deliberately: the canonical arm was built
# and probed on dev (see [env.dev.vars]) and DECLINED — entity masking turns a
# named-project ask into a discovery ask. Prod must not adopt a mode dev
# measured and rejected.
#
# SIL_EMBED_FIRST is deliberately NOT set here. Flipping the ladder while the
# index is empty would embed every turn and match nothing. It goes on in step 2,
# after a rebuild run proves the vector count, in its own change.
# bge-m3 everywhere the worker embeds — decided by the U12 bake-off (PR #222),
# founder's call 18 Aug 2026. Must match dev: one model, all lanes, all envs.
SIL_EMBED_MODEL = "@cf/baai/bge-m3"
SIL_REGISTRY_URL = "https://raw.githubusercontent.com/nagarjunveerapu/ConverseSpine/main/corpus/intent-registry.jsonl"
SIL_CANONICAL_EMBED = "false"
SIL_STATE_TOKENS = "true"
SIL_INTENT_PROJECTION = "p32-1c003deba7"
LOG_LEVEL = "info"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
DEFAULT_BUILDER_ID = "lokations"
ADVISOR_BUILDER_ID = "naya-advisor"
LANGFUSE_BASE_URL = "https://cloud.langfuse.com"
# HTTP fallback if service binding is cold/misnamed (same pattern as dig).
NAYADESK_URL = "https://nayadesk-prod.nagarjun-arjun.workers.dev"
WA_PROJECT_FIRST = "off"
# FAILURE_*/CHIP_RANK_LIVE/UNDERSTANDING_CAPTURE stay unset (= off) — each is a
# separate rollout decision, not part of filling the intent index.
# Cutover runbook: NayaDesk docs/PROD_CUTOVER.md

# ── Understanding on prod, step 1b: give prod a clock ─────────────────────
# PR #218 gave prod the index, the corpus URL and the geometry — and prod still
# could not fill any of it, because prod had NO cron at all. `triggers` is not
# inherited by a named environment and there is no top-level [triggers], so the
# whole scheduled() handler was unreachable here: the intent index would never
# rebuild and the education index would never build a first time.
#
# Daily, not dev's weekly ("30 3 * * 1"). The rebuild is incremental — it diffs
# the registry against a KV manifest by id + contentHash and embeds only what
# changed — so after the first fill a run costs a fetch and no embeddings. Weekly
# would mean up to seven days between a corpus change and prod seeing it, for no
# saving.
#
# 03:30 UTC = 09:00 IST, off the buyer peak. Not "30 22 * * *": that cron is
# routed to auto-teach in scheduled(), which is a separate rollout decision
# (UNDERSTANDING_AUTO_TEACH is unset here) — every other expression falls through
# to rebuildIntentIndex + rebuildEducationIndex, which is what this is for.
#
# A run either completes or repeats: the manifest is persisted once at the end,
# and upserts are idempotent, so a killed invocation loses progress but never
# leaves a half-described index. Per-batch failures are collected and the loop
# continues, so one bad batch retries on the next run instead of failing the fill.
[env.prod.triggers]
crons = ["30 3 * * *"]

# ── Fully local stack (env.local) ─────────────────────────────────────────
# Everything on one laptop: this Worker and NayaDesk both on localhost, against
# NayaDesk's LOCAL D1 — so a database you just bootstrapped is the one the bot
# reads and writes.
#
# The one real difference from env.dev: no [[services]] block. A service binding
# always wins over NAYADESK_URL in crm/nayadesk-client.ts, and a bound service
# can only point at a DEPLOYED worker — which would quietly send local turns to
# the shared dev database. Dropping the binding takes the HTTP path to localhost.
#
# Vectorize, Workers AI and KV stay remote = true: none has a local simulator and
# all are read-mostly here. So this env still needs Cloudflare auth
# (`wrangler login`) even though the Worker code runs on your machine.
#
# Vars mirror [env.dev.vars] — keep them in step when you change a flag there.
#   Terminal 1:  cd ../NayaDesk && npm run dev:local
#   Terminal 2:  npm run dev:local
[env.local]
name = "converse-spine-local"

[[env.local.kv_namespaces]]
binding = "TURN_CACHE"
id = "66ef723ea8614317b80aac74b77f03d1"
preview_id = "66ef723ea8614317b80aac74b77f03d1"
remote = true

[[env.local.durable_objects.bindings]]
name = "TURN_DEBOUNCER"
class_name = "TurnDebouncer"

[[env.local.vectorize]]
binding = "INTENT_VECTORS"
index_name = "naya-intent-p32-1c003deba7-full-dev"
remote = true

[[env.local.vectorize]]
binding = "PROJECT_VECTORS"
index_name = "naya-project-names-m3-dev"
remote = true

[[env.local.vectorize]]
binding = "EDUCATION_VECTORS"
index_name = "naya-buyer-education-m3-dev"
remote = true

[env.local.ai]
binding = "AI"
remote = true

[env.local.vars]
# Keys the rebuild manifest to this env's own index — see intentManifestKey.
# Must equal this env's INTENT_VECTORS index_name.
SIL_INTENT_INDEX = "naya-intent-p32-1c003deba7-full-dev"
NAYADESK_URL = "http://localhost:8787"
ADVISOR_BUILDER_ID = "naya-advisor"
LOG_LEVEL = "info"
LOCAL_TURN_LOG = "on"
FAILURE_LOG = "true"
FAILURE_TOOLS = "true"
FAILURE_ROUTING = "true"
FAILURE_SEARCH = "true"
FAILURE_ANSWER = "true"
WA_PROJECT_FIRST = "on"
ROUTING_IN_GOAL = "false"
UNDERSTANDING_BEFORE_MUTATION = "true"
TOPIC_UNION = "true"
CHIP_RANK_LIVE = "true"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
DEFAULT_BUILDER_ID = "lokations"
LANGFUSE_BASE_URL = "https://cloud.langfuse.com"
SIL_EMBED_MODEL = "@cf/baai/bge-m3"
SIL_REGISTRY_URL = "https://raw.githubusercontent.com/nagarjunveerapu/ConverseSpine/main/corpus/intent-registry.jsonl"
SIL_CANONICAL_EMBED = "false"
SIL_STATE_TOKENS = "true"
UNDERSTANDING_CAPTURE = "true"
SIL_EVAL_ENABLED = "true"
UNDERSTANDING_AUTO_TEACH = "false"
SIL_INTENT_PROJECTION = "p32-1c003deba7"
SIL_EMBED_FIRST = "true"